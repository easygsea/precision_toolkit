[tool.poetry]
name = "clinical-tools"
version = "0.1.0"
description = "An integrated toolset to support clinical validation"
authors = ["Canada's Michael Smith Genome Sciences Centre - Precision Informatics"]
readme = "README.md"
packages = [
    { include = "clinical_tools", from = "src" },
    { include = "bin", from = "src" },
]

[tool.poetry.dependencies]
python = "3.11.7"
python-docx = "1.1.2"
pandas = "2.2.3"
statsmodels = "0.14.4"
tabulate = "0.9.0"

[tool.poetry.scripts]
summarize-variant-concordance = "bin.summarize_variant_concordance:main"
curate-variant-concordance = "bin.curate_variant_concordance:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

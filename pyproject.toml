[project]
name = "clinical-tools"
version = "1.2.2"
description = "An integrated toolset to support clinical validation"
readme = "README.md"
requires-python = ">=3.11,<4"
authors = [
    { name = "Canada's Michael Smith Genome Sciences Centre - Precision Informatics" }
]
dependencies = [
    "matplotlib==3.10.1",
    "pysam==0.23.0",
    "python-docx==1.1.2",
    "pandas==2.2.3",
    "requests==2.32.3",
    "scipy==1.15.2",
    "seaborn==0.13.2",
    "statsmodels==0.14.4",
    "tabulate==0.9.0",
    "openpyxl==3.1.5"
]

[tool.mypy]
mypy_path = "src"

[dependency-groups]
dev = [
    "pre-commit==4.3.0",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "pytest-workflow==2.0.1",
    "pytest-xdist==3.6.1",
    "types-requests==2.32.4.20260107",
]

[project.scripts]
compile-dragen-metrics = "clinical_tools.cli.compile_dragen_metrics:main"
convert-multi-sample-vcf = "clinical_tools.cli.convert_multi_sample_vcf:main"
count-variants-by-size = "clinical_tools.cli.count_variants_by_size:main"
fetch-pull-requests = "clinical_tools.cli.fetch_pull_requests:main"
generate-standardized-bed = "clinical_tools.cli.generate_standardized_bed:main"
jira-table = "clinical_tools.cli.jira_table:main"
manual-diagnostic-metric-curation = "clinical_tools.cli.manual_diagnostic_metric_curation:main"
plot-dragen-metrics = "clinical_tools.cli.plot_dragen_metrics:main"
plot-gene-boxplots = "clinical_tools.cli.plot_gene_boxplots:main"
plot-signal-correlation = "clinical_tools.cli.plot_signal_correlation:main"
plot-target-tracts = "clinical_tools.cli.plot_target_tracts:main"
summarize-diagnostic-metrics = "clinical_tools.cli.summarize_diagnostic_metrics:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "clinical_tools"

[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
    "tests/standalone",
    "tests/workflow",
]
addopts = "-v --cov=src --cov-report=term-missing"

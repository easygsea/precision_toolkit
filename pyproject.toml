[tool.poetry]
name = "clinical-tools"
version = "0.1.0"
description = "An integrated toolset to support clinical validation"
authors = ["Canada's Michael Smith Genome Sciences Centre - Precision Informatics"]
readme = "README.md"
packages = [
    { include = "clinical_tools", from = "src" },
    { include = "bin", from = "src" },
]

[tool.poetry.dependencies]
pysam = "0.22.1"
python = "3.11.7"
python-docx = "1.1.2"
pandas = "2.2.3"
statsmodels = "0.14.4"
tabulate = "0.9.0"

[tool.poetry.group.dev.dependencies]
pyproject-pre-commit = "0.4.1"
pytest = "8.3.4"
pytest-cov = "4.0.0"
pytest-workflow = "2.0.1"
pytest-xdist = "3.6.1"

[tool.poetry.scripts]
summarize-diagnostic-metrics = "bin.summarize_diagnostic_metrics:main"
manual-diagnostic-metric-curation = "bin.manual_diagnostic_metric_curation:main"
convert-multi-sample-vcf = "bin.convert_multi_sample_vcf:main"
count-variants-by-size = "bin.count_variants_by_size:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
    "tests/standalone",
    "tests/workflow",
]
addopts = "-v --cov=src --cov-report=term-missing"

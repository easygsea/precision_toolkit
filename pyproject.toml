[tool.poetry]
name = "clinical-tools"
version = "0.1.0"
description = "An integrated toolset to support clinical validation"
authors = ["Canada's Michael Smith Genome Sciences Centre"]
readme = "README.md"
packages = [
    { include = "clinical_tools", from = "src" },
]

[tool.poetry.dependencies]
python = "3.11.7"
pandas = "2.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

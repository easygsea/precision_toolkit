rules:
  - id: no-breakpoint
    languages:
      - python
    message: "Do not commit debugging breakpoints."
    pattern: breakpoint(...)
    severity: ERROR

  - id: no-pdb-import
    languages:
      - python
    message: "Do not commit pdb imports."
    patterns:
      - pattern-either:
          - pattern: import pdb
          - pattern: from pdb import $NAME
    severity: ERROR

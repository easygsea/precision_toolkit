rules:
  - id: commit-message-format
    languages:
      - generic
    message: "Commit subject must follow 'TICKET imperative verb ...', for example 'CDI-743 enforce commit message format'."
    pattern-regex: '(?s)\A(?!CDI-[0-9]+ (?:add|allow|automate|avoid|build|bump|centralize|check|clarify|clean|configure|convert|create|delete|disable|document|enable|enforce|enhance|ensure|extract|fix|format|generate|improve|introduce|make|migrate|move|parse|pin|prevent|refactor|remove|rename|replace|resolve|restore|retarget|return|run|set|simplify|sort|support|test|update|upgrade|use|validate|write)\b [^\r\n]+(?:\r?\n|\Z))[\s\S]+'
    severity: ERROR

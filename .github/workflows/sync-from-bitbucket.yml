name: Sync Bitbucket to GitHub

on:
  schedule:
    # Run every day at 8am
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Add Bitbucket remote
        run: |
          git remote add bitbucket https://${{ secrets.BITBUCKET_USER }}:${{ secrets.BITBUCKET_TOKEN }}@${{ secrets.BITBUCKET_REPO_URL }}
          git remote set-url bitbucket https://${{ secrets.BITBUCKET_USER }}:${{ secrets.BITBUCKET_TOKEN }}@${{ secrets.BITBUCKET_REPO_URL }}

      - name: Fetch from Bitbucket
        run: git fetch --prune bitbucket

      - name: Push to GitHub
        run: |
          git push origin refs/remotes/bitbucket/main:main --force
          git push origin --tags

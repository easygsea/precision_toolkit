default_stages: [pre-commit]
exclude: ^src/third_party/

repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/.*/data/|^tests_data/
      - id: end-of-file-fixer
        exclude: ^tests/.*/data/|^tests_data/

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.90
    hooks:
      - id: ty

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.157.0
    hooks:
      - id: semgrep
        args: ["--config", ".semgrep", "--error", "--quiet"]
        files: "^src/|^tests/"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        types: [python]
        args: ["-r", "-lll", "-c", "pyproject.toml"]
        files: "^src/"

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        args: [
          "--ignore", "DL3003",  # Allow WORKDIR to change directories
          "--ignore", "DL3008",  # Allow apt-get without version pins for latest packages
          "--ignore", "DL3013"   # Allow pip without version pins for latest pip
        ]
        files: "^Dockerfile"

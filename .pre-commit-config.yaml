default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/PyCQA/isort
    rev: 6.0.0
    hooks:
      - id: isort
        types: [python]
        args: ["--profile", "black", "--line-length", "88"]
        files: "^src/|^tests/"

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        types: [python]
        args: ["--line-length", "88"]
        files: "^src/|^tests/"

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        name: mypy (src)
        types: [python]
        args: ["--no-warn-return-any"]
        additional_dependencies: [pandas-stubs, types-tabulate]
        files: "^src/"
      - id: mypy
        name: mypy (tests)
        types: [python]
        args: ["--no-warn-return-any", "--explicit-package-bases"]
        additional_dependencies: [pandas-stubs, types-tabulate]
        files: "^tests/"

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.2
    hooks:
      - id: flake8
        types: [python]
        args:
          - "--exclude"
          - ".git,*__init__.py"
          - "--max-line-length"
          - "88"
          - "--ignore"
          - "D104,W503"
        additional_dependencies: [flake8-docstrings]
        files: "^src/|^tests/"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.7
    hooks:
      - id: ruff
        args: ["--fix"]
        types: [python]
        files: "^src/|^tests/"
      - id: ruff-format
        types: [python]
        files: "^src/|^tests/"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        types: [python]
        args: ["-r", "-lll", "-c", "pyproject.toml"]
        files: "^src/"
        
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.12.1b3
    hooks:
      - id: hadolint
        args: [
            "--ignore", "DL3003",  # Use WORKDIR to switch to a directory
            "--ignore", "DL3008",  # Pin versions in apt get install - we need to install latest versions
            "--ignore", "DL3013"   # Pin versions in pip - we need latest pip for poetry
        ]
        files: "^Dockerfile"
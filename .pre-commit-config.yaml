default_stages: [pre-commit]
default_install_hook_types: [commit-msg, pre-commit]
exclude: ^src/third_party/

repos:
  - repo: local
    hooks:
      - id: branch-name
        name: validate branch name
        entry: .pre-commit/validate_branch_name.sh
        language: script
        always_run: true
        pass_filenames: false

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: ^tests/.*/data/|^tests_data/
      - id: trailing-whitespace
        exclude: ^tests/.*/data/|^tests_data/

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.90
    hooks:
      - id: ty

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: ["--indent", "2", "--write"]

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.157.0
    hooks:
      - id: semgrep
        name: semgrep commit message format
        args: ["--config", "commit-message.yaml", "--error", "--quiet"]
        stages: [commit-msg]
      - id: semgrep
        args: ["--config", ".semgrep", "--error", "--quiet"]
        files: "^src/|^tests/"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        types: [python]
        args: ["-r", "-lll", "-c", "pyproject.toml"]
        files: "^src/"

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        args: [
          "--ignore", "DL3003",  # Allow WORKDIR to change directories
          "--ignore", "DL3008",  # Allow apt-get without version pins for latest packages
          "--ignore", "DL3013"   # Allow pip without version pins for latest pip
        ]
        files: "^Dockerfile"

default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/.*/data/|^tests_data/
      - id: end-of-file-fixer
        exclude: ^tests/.*/data/|^tests_data/

  - repo: https://github.com/PyCQA/isort
    rev: 6.0.0
    hooks:
      - id: isort
        types: [python]
        args: ["--profile", "black"]
        files: "^src/|^tests/"

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        types: [python]
        args: ["--line-length", "88"]
        files: "^src/|^tests/"

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        name: mypy (src)
        types: [python]
        args: ["--no-warn-return-any", "--disallow-untyped-defs"]
        additional_dependencies:
          - pandas-stubs==2.2.3.241126
          - pysam==0.22.1
          - python-docx==1.1.2
          - scipy-stubs==1.15.2.2
          - statsmodels==0.14.4
          - types-seaborn==0.13.2.20250111
          - types-tabulate==0.9.0.20241207
          - pysam==0.22.1
          - types-requests==2.32.4.20260107
        files: "^src/"
      - id: mypy
        name: mypy (tests)
        types: [python]
        args: ["--no-warn-return-any", "--explicit-package-bases", "--disallow-untyped-defs"]
        additional_dependencies:
          - pandas-stubs==2.2.3.241126
          - pysam==0.22.1
          - pytest==8.3.4
          - statsmodels==0.14.4
          - types-tabulate==0.9.0.20241207
          - types-requests==2.32.4.20260107
        files: "^tests/"

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.2
    hooks:
      - id: flake8
        types: [python]
        args: [
          "--exclude", ".git,*__init__.py",
          "--max-line-length", "88",
          "--ignore", "D104",  # Ignore missing docstring in public package
          "--ignore", "W503"   # Ignore line break before binary operator (matches black style)
        ]
        additional_dependencies: [flake8-docstrings]
        files: "^src/|^tests/"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.7
    hooks:
      - id: ruff
        args: ["--fix"]  # Auto-fix issues
        types: [python]
        files: "^src/|^tests/"
      - id: ruff-format
        types: [python]
        files: "^src/|^tests/"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        types: [python]
        args: ["-r", "-lll", "-c", "pyproject.toml"]
        files: "^src/"

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.12.1b3
    hooks:
      - id: hadolint
        args: [
          "--ignore", "DL3003",  # Allow WORKDIR to change directories
          "--ignore", "DL3008",  # Allow apt-get without version pins for latest packages
          "--ignore", "DL3013"   # Allow pip without version pins for latest pip
        ]
        files: "^Dockerfile"
